# Qodo Quality Gate -- deterministic rules, run BESIDE Qodo Code Review.
#
# Engine: Opengrep (LGPL-2.1), invoked as an unmodified external binary. See NOTICE.
#
# These rules cover the syntactic floor: banned APIs, dangerous literals, unsafe
# shapes. Anything requiring judgment (authorization correctness, business logic,
# exploitability) is deliberately NOT here -- that is Qodo's half of the gate.
#
# Ported from the validated set in ~/opengrep-triage. Every rule was measured
# against real production code before landing here.
rules:
  - id: "SEC-CRYPTO-01"
    message: "SEC-CRYPTO-01 (CWE-327, CWE-1240): weak or broken hash used for password storage"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8503
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches hashlib.md5/sha1 and hashlib.new with a literal algorithm name. Misses an
        algorithm supplied via a variable, config value, or reflection, and cannot distinguish a
        security use from a benign cache-key or ETag use.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-327"
        - "CWE-1240"
      owasp:
        - "A02:2021"
      frameworks:
        - "FIPS-HR-01"
        - "PCI-DSS-6.2.4"
        - "NIST-SC-13"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "hashlib.md5(...)"
          - pattern: "hashlib.sha1(...)"
          - pattern: "hashlib.new(\"md5\", ...)"
          - pattern: "hashlib.new(\"sha1\", ...)"
  - id: "SEC-SECRET-01"
    message: "SEC-SECRET-01 (CWE-798, CWE-259): hard-coded credential or secret literal"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8501
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches an uppercase SECRET/TOKEN/CREDENTIAL identifier assigned a literal of 12+ chars.
        Misses lowercase or unconventional names, values built by concatenation, credentials in
        non-Python config files, and short high-value literals below the length floor.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-798"
        - "CWE-259"
      owasp:
        - "A07:2021"
      frameworks:
        - "FIPS-HR-06"
        - "PCI-DSS-6.2.4"
        - "HIPAA-HR-04"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-regex: "(?i)\\b[A-Z_]*(SECRET|TOKEN|CREDENTIAL)[A-Z_]*\\s*=\\s*[\"\\'][^\"\\']{12,}[\"\\']"
  - id: "SEC-SQLI-01"
    message: "SEC-SQLI-01 (CWE-89): SQL built by string concatenation"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8506
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches concatenation, f-string, percent-format and .format() directly inside an
        execute() call. Misses a query assembled into a variable on a prior line, built by a
        helper function, or passed through an ORM raw-SQL wrapper.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-89"
      owasp:
        - "A03:2021"
      frameworks:
        - "PCI-DSS-6.2.4"
        - "OWASP-HR-03"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "$CUR.execute(\"...\" + ...)"
          - pattern: "$CUR.execute(f\"...\")"
          - pattern: "$CUR.execute(\"...\" % ...)"
          - pattern: "$CUR.execute(\"...\".format(...))"
  - id: "SEC-DESER-01"
    message: "SEC-DESER-01 (CWE-502): unsafe deserialization of untrusted data"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8502
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches pickle.loads, yaml.load with a single argument, and marshal.loads. Misses
        aliased imports, yaml.load called with an explicit unsafe Loader keyword, and other
        deserialisers such as dill, shelve or jsonpickle.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-502"
      owasp:
        - "A08:2021"
      frameworks:
        - "OWASP-HR-06"
        - "STIG-HR-06"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "pickle.loads(...)"
          - pattern: "yaml.load($X)"
          - pattern: "marshal.loads(...)"
  - id: "SEC-CMDI-01"
    message: "SEC-CMDI-01 (CWE-78): OS command built from a non-literal"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8507
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches os.system and subprocess with shell=True. Misses os.popen, the os.exec family,
        commands routed through a wrapper utility, and shell=True supplied via kwargs expansion.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-78"
      owasp:
        - "A03:2021"
      frameworks:
        - "OWASP-HR-03"
        - "STIG-HR-06"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "os.system(...)"
          - pattern: "subprocess.$F(..., shell=True, ...)"
  - id: "SEC-TLS-01"
    message: "SEC-TLS-01 (CWE-295): TLS certificate verification disabled"
    severity: "ERROR"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8504
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Matches requests with a literal verify=False and the private ssl unverified-context
        helper. Misses the flag passed as a variable, a session-level assignment, and urllib3 or
        httpx equivalents.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "action_required"
      cwe:
        - "CWE-295"
      owasp:
        - "A02:2021"
        - "A05:2021"
      frameworks:
        - "FIPS-HR-04"
        - "PCI-DSS-4.2.1"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "requests.$M(..., verify=False, ...)"
          - pattern: "ssl._create_unverified_context(...)"
  - id: "SEC-RANDOM-01"
    message: "SEC-RANDOM-01 (CWE-338, CWE-330): non-cryptographic PRNG in a security context"
    severity: "WARNING"
    languages:
      - "python"
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      qodo_rule_id: 8505
      qodo_schema_version: 1
      qodo_integration_mode: status_check
      portability_tier: A
      limitations: >-
        Flags random.random/randint/choice unconditionally, so it fires on legitimate non-
        security uses such as retry jitter or sampling. Does not resolve whether the value
        reaches a security sink; triage accordingly.
      qodo_finding_source: "StaticAnalysisFinding"
      qodo_action_level: "remediation_recommended"
      cwe:
        - "CWE-338"
        - "CWE-330"
      owasp:
        - "A02:2021"
      frameworks:
        - "FIPS-HR-02"
      confidence: "HIGH"
      version: "1.0.0"
    patterns:
      - pattern-either:
          - pattern: "random.random(...)"
          - pattern: "random.randint(...)"
          - pattern: "random.choice(...)"
