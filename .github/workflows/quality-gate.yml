name: quality-gate

on:
  pull_request:
    branches: [main]

jobs:
  deterministic:
    # This job name is what you add to branch protection's required-checks list.
    # Powered by Opengrep (LGPL-2.1) -- see NOTICE.
    # Renaming it silently breaks the gate -- the required check goes permanently
    # pending and nothing merges.
    name: Qodo Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contract gate: a malformed rule must fail the build, not silently
      # under-match. pyyaml is last-wins on duplicate keys, so a rule can look fine
      # in Python and be rejected outright by the engine -- E9 catches that.
      - name: Validate rule contract
        run: |
          python3 -m pip install --quiet jsonschema pyyaml
          python3 .qodo/ci/validate_rules.py .qodo/quality-gate/

      - name: Install analysis engine
        run: |
          gh release download v1.26.0 --repo opengrep/opengrep \
            --pattern 'opengrep_manylinux_x86' --output /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
          opengrep --version
        env:
          GH_TOKEN: ${{ github.token }}

      # --error makes a finding a non-zero exit, which is what fails the check.
      # One invocation for the whole ruleset: batching is ~2.3x faster than
      # scanning per-rule.
      # Ruling tests: every rule has pinned expected findings. Fails on drift in
      # either direction -- a rule that stops catching a true positive, a safe
      # fixture that starts firing, or a known gap that closes (baseline is then
      # stale and must be refreshed deliberately).
      - name: Ruling tests
        run: python3 .qodo/ci/ruling.py .qodo/quality-gate/ .qodo/fixtures --baseline .qodo/ci/ruling-baseline.json

      # --exclude: the fixtures are intentionally vulnerable; scanning them
      # would make the repo permanently fail its own gate.
      - name: Scan
        run: opengrep scan --config .qodo/quality-gate/ --exclude='.qodo/fixtures' --error --quiet .

      # Opengrep can silently drop matches in regions it fails to parse, while
      # still exiting 0. Fail loudly instead of reporting false confidence.
      - name: Parse-integrity check
        if: always()
        run: |
          opengrep scan --config .qodo/quality-gate/ --exclude='.qodo/fixtures' --json --quiet . > findings.json || true
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("findings.json"))
          partial = [e for e in d.get("errors", []) if "PartialParsing" in json.dumps(e)]
          print(f"findings={len(d.get('results', []))} partial_parsing={len(partial)}")
          if partial:
              print("::error::Opengrep failed to fully parse some files; matches may be missed")
              sys.exit(1)
          EOF
