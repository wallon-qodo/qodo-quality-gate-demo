name: quality-gate

on:
  pull_request:
    branches: [main]

jobs:
  deterministic:
    # This job name is what you add to branch protection's required-checks list.
    # Renaming it silently breaks the gate -- the required check goes permanently
    # pending and nothing merges.
    name: Deterministic Quality Gate (Opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          gh release download v1.26.0 --repo opengrep/opengrep \
            --pattern 'opengrep_manylinux_x86' --output /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
          opengrep --version
        env:
          GH_TOKEN: ${{ github.token }}

      # --error makes a finding a non-zero exit, which is what fails the check.
      # One invocation for the whole ruleset: batching is ~2.3x faster than
      # scanning per-rule.
      - name: Scan
        run: opengrep scan --config .qodo/opengrep/ --error --quiet .

      # Opengrep can silently drop matches in regions it fails to parse, while
      # still exiting 0. Fail loudly instead of reporting false confidence.
      - name: Parse-integrity check
        if: always()
        run: |
          opengrep scan --config .qodo/opengrep/ --json --quiet . > findings.json || true
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("findings.json"))
          partial = [e for e in d.get("errors", []) if "PartialParsing" in json.dumps(e)]
          print(f"findings={len(d.get('results', []))} partial_parsing={len(partial)}")
          if partial:
              print("::error::Opengrep failed to fully parse some files; matches may be missed")
              sys.exit(1)
          EOF
